# Publishes the static page with GitHub Pages. Enable it once in the repository:
# Settings > Pages > Build and deployment > Source: GitHub Actions.
# Only the files the page needs are published: index.html, app.mjs, style.css and src/.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Collect the static files
        run: |
          mkdir -p _site/src
          cp index.html app.mjs style.css _site/
          cp src/*.mjs _site/src/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
